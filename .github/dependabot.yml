# One grouped PR per ecosystem per month. Security fixes are not delayed by this: the nightly
# Command Center scan (OSV) flags vulnerable versions, and Dependabot security updates are separate.
# @types/node stays on the runtime's major (Node 22).
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    all:
      patterns:
      - '*'
  ignore:
  - dependency-name: '@types/node'
    update-types:
    - version-update:semver-major
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    all:
      patterns:
      - '*'
